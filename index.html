<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="culturama-favico.png" type="image/x-icon">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Work+Sans&display=swap" rel="stylesheet">

    <title>Pesquisa - Culturama</title>
</head>
<body>
    <header>
        <img src="images/logo-culturama.png" alt="Logo da Culturama">
        <h1>Pesquisa online</h1>
    </header>
    <section>
        <form action="" method="get">
            <fieldset>
                <legend>Dados Pessoais</legend>
            
                <label for="userName">Nome</label>
                <input id="userName" type="text" name="userName" required>
                <br>
                <label for="userAge">Idade</label>
                <input id="userAge" type="number" name="userAge" min="12" max="100" required>
                <br>
                <label for="birthDate">Data De Nascimento</label>
                <input id="birthDate" type="date" name="birthDate">
                <br>
                <label for="userEmail">Email</label>
                <input id="userEmail" type="email" name="userEmail" required>
                <br>
                <label for="userPhoneNumber">Telefone</label>
                <input id="userPhoneNumber" type="tel" name="userPhoneNumber" pattern="[0-9]{11}" placeholder="DDD + Numero">
                <br>
                <label for="userImage">Upload de foto</label>
                <input id="userImage" type="file" accept="image/*" name="userImage">
                <br>
            </fieldset>

            <fieldset>
                <legend>Perfil</legend>

                <p>Gênero:</p>
                <label for="userGenderFemale">Feminino</label>
                <input id="userGenderFemale" type="radio" name="userGender" value="Feminino">

                <label for="userGenderMale">Masculino</label>
                <input id="userGenderMale" type="radio" name="userGender" value="Masculino">

                <label for="userGenderNotInformed">Prefiro não informar</label>
                <input id="userGenderNotInformed" type="radio" name="userGender" value="notInformed">
                <br>

                <label for="maritalStatus">Estado civil</label>
                <select name="maritalStatus">
                    <option value="Casado">Casado</option>
                    <option value="Solteiro">Solteiro</option>
                    <option value="Divorciado">Divorciado</option>
                    <option value="Namorando">Namorando</option>
                </select>

                <label for="userState">Estado</label>
                <select name="userState" required>
                    <option value="AC">AC</option>
                    <option value="AL">AL</option>
                    <option value="AP">AP</option>
                    <option value="AM">AM</option>
                    <option value="BA">BA</option>
                    <option value="CE">CE</option>
                    <option value="DF">DF</option>
                    <option value="ES">ES</option>
                    <option value="GO">GO</option>
                    <option value="MA">MA</option>
                    <option value="MS">MS</option>
                    <option value="MT">MT</option>
                    <option value="MG">MG</option>
                    <option value="PA">PA</option>
                    <option value="PB">PB</option>
                    <option value="PR">PR</option>
                    <option value="PE">PE</option>
                    <option value="PI">PI</option>
                    <option value="RJ">RJ</option>
                    <option value="RN">RN</option>
                    <option value="RS">RS</option>
                    <option value="RO">RO</option>
                    <option value="RR">RR</option>
                    <option value="SC">SC</option>
                    <option value="SP">SP</option>
                    <option value="SE">SE</option>
                    <option value="TO">TO</option>
                </select>

                <label for="userCity">Cidade</label>
                <input id="userCity" type="text" name="userCity">
            </fieldset>

            <fieldset>
                <legend>Hábitos</legend>

                <p>Redes Sociais</p>
                <input id="socialInstagram" type="checkbox" name="social" value="instagram">
                <label for="socialInstagram">Instagram</label>
                <br>
                <input id="socialFacebook" type="checkbox" name="social" value="facebook">
                <label for="socialFacebook">Facebook</label>
                <br>
                <input id="socialLinkedin" type="checkbox" name="social" value="linkedin">
                <label for="socialLinkedin">Linkedin</label>
                <br>
                <input id="socialTwitter" type="checkbox" name="social" value="twitter">
                <label for="socialTwitter">Twitter</label>
                <br>
                <label for="musicStyle">Estilo musical:</label>
                <input list="styleTypes" id="musicStyle" name="userMusicStyle" type="text">
                <datalist id="styleTypes">
                    <option value="rock">
                    <option value="sertanejo">
                    <option value="pop">
                    <option value="classica">
                </datalist>
                <br>
                <label for="favoriteColor">Cor favorita</label>
                <input type="color" name="userFavoriteColor" id="favoriteColor">
            </fieldset>

            <fieldset>
                <legend>Opinião</legend>

                <p>Como você avalia sua experiência?</p>
                <label for="satisfactionOtima">Ótima</label>
                <input id="satisfactionOtima" type="radio" name="userSatisfaction" value="Otima" required>

                <label for="satisfactionBoa">Boa</label>
                <input id="satisfactionBoa" type="radio" name="userSatisfaction" value="Boa" required>

                <label for="satisfactionRegular">Regular</label>
                <input id="satisfactionRegular" type="radio" name="userSatisfaction" value="Regular" required>

                <label for="satisfactionRuim">Ruim</label>
                <input id="satisfactionRuim" type="radio" name="userSatisfaction" value="Ruim" required>
                <br>

                <label for="userComment">Comentário</label>
                <br>
                <textarea id="userComment" name="userComment" rows="4" cols="40" placeholder="Deixe aqui sua opinião, sugestão ou crítica..."></textarea>
            </fieldset>

            <fieldset>
                <legend>Confirmações</legend>

                <input type="checkbox" name="userLgpd" id="userLgpdTerm" value="confirmed" required>
                <label for="userLgpdTerm">Eu aceito participar da pesquisa.</label>
                <br>
                <input type="checkbox" name="userGetResult" id="getResult" value="confirmed">
                <label for="userLgpdTerm">Desejo receber o resultado por email.</label>
            </fieldset>

            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>
        </form>
    </section>
</body>
</html>
